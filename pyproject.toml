[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-route-schematic"
version = "0.1.0.dev0"
description = "Windows desktop application for editable utility-pole route schematics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "Shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
    "pyinstaller>=6,<7",
]

[project.scripts]
pole-route-schematic = "pole_route.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

